name: Tests

# Läuft bei jedem Push und bei Pull Requests, in zwei Jobs nebeneinander:
# - Kern-Tests und iOS-Build des Kerns: ohne WhisperKit und MLX, in Minuten durch.
# - App bauen und testen: die ganze Mac-App samt WhisperKit, MLX und Sparkle, danach die App-Tests
#   (`Tests/`). Dauert länger, fängt aber Fehler, die der Kern allein nicht sieht. Signiert wird
#   ad hoc, wie im Projekt ohne Team voreingestellt; die Tests laufen in einem leeren Temp-Ordner.
#
# Die veröffentlichte DMG entsteht nicht hier, sondern auf dem Mac mit `./scripts/build_release.sh`.
# Grund: Signieren und Notarisieren brauchen das Developer-ID-Zertifikat, und das gehört nicht als
# Geheimnis in ein öffentliches Repository, solange es auch von Hand geht.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    name: Kern-Tests
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: Xcode-Version anzeigen
        run: xcodebuild -version

      - name: Pakete cachen
        uses: actions/cache@v5
        with:
          path: Packages/EarnoteKit/.build
          key: spm-${{ runner.os }}-${{ hashFiles('Packages/EarnoteKit/Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Kern-Tests (ohne WhisperKit und MLX)
        working-directory: Packages/EarnoteKit
        run: swift test --test-product EarnoteKitPackageTests

      - name: iOS-Build des Kerns
        working-directory: Packages/EarnoteKit
        run: xcodebuild build -scheme EarnoteCore -destination 'generic/platform=iOS' | tail -5

  app:
    name: App bauen und testen
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - name: Xcode-Version anzeigen
        run: xcodebuild -version

      # MLX übersetzt Metal-Shader; die Werkzeuge dafür lädt Xcode seit Version 26 getrennt nach
      - name: Metal-Werkzeuge laden
        run: xcodebuild -downloadComponent MetalToolchain

      - name: Pakete cachen
        uses: actions/cache@v5
        with:
          path: build/SourcePackages
          key: app-spm-${{ runner.os }}-${{ hashFiles('Earnote.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: app-spm-${{ runner.os }}-

      - name: App bauen und App-Tests ausführen
        run: >
          xcodebuild test -quiet
          -project Earnote.xcodeproj -scheme Earnote -configuration Debug
          -destination 'platform=macOS'
          -derivedDataPath build
          -clonedSourcePackagesDirPath build/SourcePackages
          -skipMacroValidation -skipPackagePluginValidation

  ios:
    name: iPhone-App bauen
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - name: Xcode-Version anzeigen
        run: xcodebuild -version

      - name: Metal-Werkzeuge laden
        run: xcodebuild -downloadComponent MetalToolchain

      - name: Projekt ist aktuell
        # Wer Dateien anlegt, muss den Generator laufen lassen – sonst fehlen sie im Build
        run: python3 scripts/generate_ios_xcodeproj.py && git diff --exit-code EarnoteiOS.xcodeproj

      - name: Pakete cachen
        uses: actions/cache@v5
        with:
          path: build-ios/SourcePackages
          key: ios-spm-${{ runner.os }}-${{ hashFiles('Packages/EarnoteKit/Package.resolved') }}
          restore-keys: ios-spm-${{ runner.os }}-

      # App, Widgets und Teilen-Erweiterung für den Simulator, ohne Signatur
      - name: App bauen
        run: >
          xcodebuild build -quiet
          -project EarnoteiOS.xcodeproj -scheme EarnoteiOS -configuration Debug
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath build-ios
          -clonedSourcePackagesDirPath build-ios/SourcePackages
          -skipMacroValidation -skipPackagePluginValidation
          CODE_SIGNING_ALLOWED=NO
