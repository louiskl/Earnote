name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Xcode-Version anzeigen
        run: xcodebuild -version

      - name: Kern-Tests (EarnoteCore, ohne WhisperKit/MLX zu bauen)
        working-directory: Packages/EarnoteKit
        run: swift test --test-product EarnoteKitPackageTests

      - name: Metal-Toolchain laden (für das lokale Sprachmodell / MLX)
        run: xcodebuild -downloadComponent MetalToolchain

      - name: App bauen und DMG erstellen
        run: ./scripts/build_release.sh

      - uses: actions/upload-artifact@v4
        with:
          name: Earnote
          path: dist/Earnote.dmg

      - name: Release veröffentlichen
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Earnote.dmg
          generate_release_notes: true
