name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  core:
    name: Kern-Tests (EarnoteCore)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Xcode auswählen
        run: sudo xcode-select -switch /Applications/Xcode_26.app

      # Die Kern-Tests brauchen weder WhisperKit noch MLX; gecacht wird trotzdem,
      # weil die Paketauflösung sonst bei jedem Lauf alles neu holt.
      - name: Pakete cachen
        uses: actions/cache@v4
        with:
          path: Packages/EarnoteKit/.build
          key: spm-${{ runner.os }}-${{ hashFiles('Packages/EarnoteKit/Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Kern-Tests
        working-directory: Packages/EarnoteKit
        run: swift test --test-product EarnoteKitPackageTests

      - name: iOS-Build des Kerns (der Kern muss ohne Mac-Code bauen)
        working-directory: Packages/EarnoteKit
        run: xcodebuild build -scheme EarnoteCore -destination 'generic/platform=iOS' | tail -5
